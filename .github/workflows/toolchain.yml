name: Build toolchain

env:
    LLVM_REF: "0d261d1ca552c95a8f007e061c787ac7132fbcbc" # 23.1.3
    # Single-stage alternative: "SingleStage", "" and "build.dir"
    CMAKE_CACHE: "ToolchainCache"
    STAGE: "stage2-"
    STAGE_BUILD_DIR: "build.dir/tools/clang/stage2-bins"
    # Stage2 is compiled by the freshly built stage1 clang, which has a new
    # mtime on every run; hash its contents so ccache can still hit
    CCACHE_COMPILERCHECK: "content"
    # Apple's ld hashes object file mtimes from the debug map into LC_UUID,
    # which made the (always -g) compiler-rt dylibs differ between runs
    ZERO_AR_DATE: "1"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write # upload release assets

# Each main run publishes a release, so only cancel superseded PR runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  toolchain-build:
    name: ${{ matrix.OS }} toolchain (${{ matrix.ARCH}})
    runs-on: ${{ matrix.RUNNER }}
    strategy:
      fail-fast: false
      matrix:
        include:
            - ARCH: x86_64
              RUNNER: ubuntu-22.04
              OS: Linux
            - ARCH: aarch64
              RUNNER: ubuntu-22.04-arm
              OS: Linux
            - ARCH: aarch64
              RUNNER: macos-latest
              OS: Darwin
    steps:
      - uses: actions/checkout@v7
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
            # One cache per platform; all three must fit GitHub's 10GB repo limit
            key: ${{ matrix.OS }}-${{ matrix.ARCH }}
            max-size: "3000MB"
      - uses: actions/checkout@v7
        with:
            repository: 'llvm/llvm-project'
            ref: ${{ env.LLVM_REF }}
            path: 'llvm'
      - name: Install deps
        if: matrix.OS == 'Linux'
        run: |
            sudo apt-get update
            sudo apt-get install -y ninja-build
      - name: Build toolchain
        run: |
            mkdir build.dir
            cmake -G Ninja \
                -B build.dir \
                -C ${{ env.CMAKE_CACHE }}.cmake \
                llvm/llvm \
                -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/${{ matrix.OS }}-${{ matrix.ARCH }}.toolchain
            cmake --build build.dir --target ${{ env.STAGE }}distribution
            cmake --build build.dir --target ${{ env.STAGE }}install-distribution-stripped
      - name: Install FileCheck
        run: |
            cmake --install ${{ env.STAGE_BUILD_DIR }} \
                --component FileCheck \
                --strip \
                --prefix ${{ matrix.OS }}-${{ matrix.ARCH }}.filecheck
      - name: Add files toolchains_llvm expects
        run: |
            toolchain=${{ matrix.OS }}-${{ matrix.ARCH }}.toolchain
            # toolchains_llvm symlinks these into its toolchain repo, so they
            # have to exist, but mull never runs them
            for tool in clang-format clang-tidy clangd; do
                stub=$toolchain/bin/$tool
                printf '#!/bin/sh\necho "%s is not shipped with this toolchain" >&2\nexit 1\n' $tool > $stub
                chmod +x $stub
            done
            # Without libc++ include/ is empty, but toolchains_llvm requires
            # include/c++ to exist and include/** to match at least one file
            mkdir -p $toolchain/include/c++
            touch $toolchain/include/c++/.keep
      - name: Package toolchain
        env:
            # The 64MB dictionary of -9 fits most of bin/llvm
            XZ_OPT: "-9"
        run: |
            # The build is reproducible; fix tar's order, mtimes and owners so
            # the archives are too. macOS' bsdtar lacks --sort, use GNU tar
            tar=$(command -v gtar || command -v tar)
            mtime=$(git -C llvm log -1 --format=%ct)
            for dist in toolchain filecheck; do
                $tar --sort=name --mtime=@$mtime \
                    --owner=0 --group=0 --numeric-owner --format=gnu \
                    -cvJf ${{ matrix.OS }}-${{ matrix.ARCH }}.$dist.tar.xz \
                    ${{ matrix.OS }}-${{ matrix.ARCH }}.$dist
            done
      - name: Upload toolchain
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "*.tar.xz"
          tag: ${{ github.run_id }}
          overwrite: true
          file_glob: true
          target_commit: ${{ github.sha }}
