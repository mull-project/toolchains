name: Build toolchain

env:
    LLVM_REF: "0d261d1ca552c95a8f007e061c787ac7132fbcbc" # 23.1.3
    # GH Actions are dead slow, can't build two-stage
    CMAKE_CACHE: "SingleStage" # ToolchainCache
    STAGE: "" # stage2-
    STAGE_BUILD_DIR: "build.dir" # build.dir/tools/clang/stage2-bins

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write # upload release assets

# Each main run publishes a release, so only cancel superseded PR runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  toolchain-build:
    name: ${{ matrix.OS }} toolchain (${{ matrix.ARCH}})
    runs-on: ${{ matrix.RUNNER }}
    strategy:
      fail-fast: false
      matrix:
        include:
            - ARCH: x86_64
              RUNNER: ubuntu-22.04
              OS: Linux
            - ARCH: aarch64
              RUNNER: ubuntu-22.04-arm
              OS: Linux
            - ARCH: aarch64
              RUNNER: macos-latest
              OS: Darwin
    steps:
      - uses: actions/checkout@v7
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
            # One cache per platform; all three must fit GitHub's 10GB repo limit
            key: ${{ matrix.OS }}-${{ matrix.ARCH }}
            max-size: "3000MB"
      - uses: actions/checkout@v7
        with:
            repository: 'llvm/llvm-project'
            ref: ${{ env.LLVM_REF }}
            path: 'llvm'
      - name: Install deps
        if: matrix.OS == 'Linux'
        run: |
            sudo apt-get update
            sudo apt-get install -y ninja-build
      - name: Build toolchain
        run: |
            mkdir build.dir
            cmake -G Ninja \
                -B build.dir \
                -C ${{ env.CMAKE_CACHE }}.cmake \
                llvm/llvm \
                -DCMAKE_INSTALL_PREFIX=${{ matrix.OS }}-${{ matrix.ARCH }}.toolchain
            cmake --build build.dir --target ${{ env.STAGE }}distribution
            cmake --build build.dir --target ${{ env.STAGE }}install-distribution-stripped
      - name: Install FileCheck
        run: |
            cmake --install ${{ env.STAGE_BUILD_DIR }} \
                --component FileCheck \
                --strip \
                --prefix ${{ matrix.OS }}-${{ matrix.ARCH }}.filecheck
      - name: Package toolchain
        run: |
            for dist in toolchain filecheck; do
                tar -cvzf \
                    ${{ matrix.OS }}-${{ matrix.ARCH }}.$dist.tar.gz \
                    ${{ matrix.OS }}-${{ matrix.ARCH }}.$dist
                tar cvfJ \
                    ${{ matrix.OS }}-${{ matrix.ARCH }}.$dist.tar.xz \
                    ${{ matrix.OS }}-${{ matrix.ARCH }}.$dist
            done
      - name: Upload toolchain
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "*.tar.*"
          tag: ${{ github.run_id }}
          overwrite: true
          file_glob: true
          target_commit: ${{ github.sha }}
